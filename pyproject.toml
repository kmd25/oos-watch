[project]
name = "oos-watch"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.162.4",
    "psycopg[binary]>=3.3.8",
    "pyjwt[crypto]>=2.15.1",
    "requests>=2.34.2",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
